name: Python research audit tests

on:
  push:
    paths:
      - "python_baseline/**"
      - "tests/**"
      - ".github/workflows/python-research-audit.yml"
  pull_request:
    paths:
      - "python_baseline/**"
      - "tests/**"
      - ".github/workflows/python-research-audit.yml"

permissions:
  contents: read

jobs:
  audit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: environment.yml
      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip numpy pandas scikit-learn joblib
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python -m compileall -q python_baseline
