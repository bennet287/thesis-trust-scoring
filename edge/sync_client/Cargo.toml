[package]
name = "sync_client"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2"
base64 = "0.22"
tar = "0.4"
flate2 = "1.0"
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
