<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1400" viewBox="0 0 2200 1400">
<style>
    .title { font: 700 34px Arial, sans-serif; fill:#17324d; }
    .subtitle { font: 400 16px Arial, sans-serif; fill:#334155; }
    .section { font: 700 22px Arial, sans-serif; fill:#17324d; }
    .boxh { font: 700 18px Arial, sans-serif; fill:white; }
    .txt { font: 14px Arial, sans-serif; fill:#1f2937; }
    .small { font: 13px Arial, sans-serif; fill:#1f2937; }
    .tiny { font: 12px Arial, sans-serif; fill:#334155; }
    .formula { font: 700 18px Arial, sans-serif; fill:#7c2d12; }
</style>
<rect width="100%" height="100%" fill="#f8fafc"/>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#2563eb"/>
  </marker>
</defs>
<text x="1100.0" y="50" class="title" text-anchor="middle">LAYERED TRUST CONTROL ARCHITECTURE (LTCA) FOR ZERO TRUST EDGE INTRUSION DECISIONING</text><text x="1100.0" y="80" class="subtitle" text-anchor="middle">Model-only baseline from WebAssembly edge IDS extended with retrieval context, behavioral memory, adaptive trust fusion, and trend-aware policy control</text><rect x="40" y="110" width="2120" height="240" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="1100.0" y="142" class="section" text-anchor="middle">CLOUD / CONTROL PLANE  (offline preparation, calibration, packaging, monitoring)</text><rect x="60" y="160" width="390" height="160" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/><rect x="60" y="160" width="390" height="34" rx="12" fill="#2563eb" stroke="#2563eb" stroke-width="0"/><text x="255" y="183" class="boxh" text-anchor="middle">1. Data &amp; Threat Intelligence</text><text x="76" y="220" class="txt" text-anchor="start">• UNSW-NB15 / labeled traffic</text><text x="76" y="244" class="txt" text-anchor="start">• Threat profiles and attack categories</text><text x="76" y="268" class="txt" text-anchor="start">• Device metadata and policy inputs</text><text x="76" y="292" class="txt" text-anchor="start">• Training / calibration split definitions</text><line x1="450" y1="240" x2="475" y2="240" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="475" y="160" width="390" height="160" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/><rect x="475" y="160" width="390" height="34" rx="12" fill="#2563eb" stroke="#2563eb" stroke-width="0"/><text x="670" y="183" class="boxh" text-anchor="middle">2. Model Training &amp; Calibration</text><text x="491" y="220" class="txt" text-anchor="start">• Train DT and RF baselines</text><text x="491" y="244" class="txt" text-anchor="start">• Compute P(attack|x)</text><text x="491" y="268" class="txt" text-anchor="start">• Convert to trust: M(x)=1−P(attack)</text><text x="491" y="292" class="txt" text-anchor="start">• Save pipeline artifacts (.joblib)</text><line x1="865" y1="240" x2="890" y2="240" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="890" y="160" width="390" height="160" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/><rect x="890" y="160" width="390" height="34" rx="12" fill="#2563eb" stroke="#2563eb" stroke-width="0"/><text x="1085" y="183" class="boxh" text-anchor="middle">3. KB Builder</text><text x="906" y="220" class="txt" text-anchor="start">• Build centroid profiles</text><text x="906" y="244" class="txt" text-anchor="start">• trusted / moderate / suspicious / malicious</text><text x="906" y="268" class="txt" text-anchor="start">• Assign profile trust priors</text><text x="906" y="292" class="txt" text-anchor="start">• Export retrieval_kb.json</text><line x1="1280" y1="240" x2="1305" y2="240" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="1305" y="160" width="390" height="160" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/><rect x="1305" y="160" width="390" height="34" rx="12" fill="#2563eb" stroke="#2563eb" stroke-width="0"/><text x="1500" y="183" class="boxh" text-anchor="middle">4. Policy Calibration</text><text x="1321" y="220" class="txt" text-anchor="start">• Separate calibration scenarios</text><text x="1321" y="244" class="txt" text-anchor="start">• Tune thresholds and trend penalties</text><text x="1321" y="268" class="txt" text-anchor="start">• Freeze best config for evaluation</text><text x="1321" y="292" class="txt" text-anchor="start">• Keep benchmark scenarios unchanged</text><line x1="1695" y1="240" x2="1720" y2="240" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="1720" y="160" width="390" height="160" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/><rect x="1720" y="160" width="390" height="34" rx="12" fill="#2563eb" stroke="#2563eb" stroke-width="0"/><text x="1915" y="183" class="boxh" text-anchor="middle">5. Package / Deploy / Sync</text><text x="1736" y="220" class="txt" text-anchor="start">• Export Rust/Wasm model path</text><text x="1736" y="244" class="txt" text-anchor="start">• Push model + KB + policy config</text><text x="1736" y="268" class="txt" text-anchor="start">• Collect logs, metrics, trust summaries</text><text x="1736" y="292" class="txt" text-anchor="start">• Versioned updates to edge nodes</text><rect x="40" y="380" width="2120" height="760" rx="18" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="1100.0" y="412" class="section" text-anchor="middle">EDGE DEVICE / PEP NODE  (offline-capable real-time operation)</text><rect x="70" y="450" width="470" height="190" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><rect x="70" y="450" width="470" height="34" rx="12" fill="#4f46e5" stroke="#4f46e5" stroke-width="0"/><text x="305" y="473" class="boxh" text-anchor="middle">1. Input / Preprocessing</text><text x="86" y="510" class="txt" text-anchor="start">• Incoming traffic / session record</text><text x="86" y="533" class="txt" text-anchor="start">• 39-feature numeric vector</text><text x="86" y="556" class="txt" text-anchor="start">• Offline normalization statistics</text><text x="86" y="579" class="txt" text-anchor="start">• Prototype uses pre-extracted features</text><rect x="585" y="450" width="470" height="190" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="585" y="450" width="470" height="34" rx="12" fill="#2563eb" stroke="#2563eb" stroke-width="0"/><text x="820" y="473" class="boxh" text-anchor="middle">2. Model Trust  M(x)</text><text x="601" y="510" class="txt" text-anchor="start">• DT or RF pipeline inference</text><text x="601" y="533" class="txt" text-anchor="start">• P(attack|x) from trained model</text><text x="601" y="556" class="txt" text-anchor="start">• Trust transform: M(x)=1−P(attack)</text><text x="601" y="579" class="txt" text-anchor="start">• Model-only branch retained for comparison</text><rect x="1100" y="450" width="470" height="190" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><rect x="1100" y="450" width="470" height="34" rx="12" fill="#7c3aed" stroke="#7c3aed" stroke-width="0"/><text x="1335" y="473" class="boxh" text-anchor="middle">3. Retrieval Context  R(x)</text><text x="1116" y="510" class="txt" text-anchor="start">• Load local centroid profiles</text><text x="1116" y="533" class="txt" text-anchor="start">• Similarity against KB centroids</text><text x="1116" y="556" class="txt" text-anchor="start">• Best profile → trust prior</text><text x="1116" y="579" class="txt" text-anchor="start">• Context can help, but can also mislead</text><rect x="1615" y="450" width="470" height="190" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><rect x="1615" y="450" width="470" height="34" rx="12" fill="#ea580c" stroke="#ea580c" stroke-width="0"/><text x="1850" y="473" class="boxh" text-anchor="middle">4. Behavioral Memory  H(x)</text><text x="1631" y="510" class="txt" text-anchor="start">• Sliding window of previous trust values</text><text x="1631" y="533" class="txt" text-anchor="start">• History-aware behavioral context</text><text x="1631" y="556" class="txt" text-anchor="start">• Captures persistence / degradation</text><text x="1631" y="579" class="txt" text-anchor="start">• Non-circular: uses past trust only</text><line x1="540" y1="545" x2="575" y2="545" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><line x1="1055" y1="545" x2="1090" y2="545" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><line x1="1570" y1="545" x2="1605" y2="545" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="90" y="690" width="760" height="210" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><rect x="90" y="690" width="760" height="34" rx="12" fill="#7c3aed" stroke="#7c3aed" stroke-width="0"/><text x="470" y="713" class="boxh" text-anchor="middle">5. LTCA Trust Estimation Layer</text><text x="110" y="748" class="txt" text-anchor="start">Inputs: M(x), R(x), H(x)</text><text x="110" y="770" class="txt" text-anchor="start">• Confidence estimation from model trust</text><text x="110" y="792" class="txt" text-anchor="start">• Signal agreement / conflict assessment</text><text x="110" y="814" class="txt" text-anchor="start">• Adaptive weighting of model, retrieval, and memory</text><text x="110" y="836" class="txt" text-anchor="start">• Output: fused trust estimate T_fused(x)</text><text x="110" y="858" class="txt" text-anchor="start"></text><text x="110" y="880" class="txt" text-anchor="start">Current thesis finding:</text><text x="110" y="902" class="txt" text-anchor="start">• naive fusion can degrade decisions</text><text x="110" y="924" class="txt" text-anchor="start">• LTCA is strongest as a safer contextual integration strategy</text><text x="600" y="846" class="formula" text-anchor="middle">T_fused(x) = adaptive_fusion(M(x), R(x), H(x))</text><rect x="900" y="690" width="550" height="210" rx="12" fill="#ffffff" stroke="#ea580c" stroke-width="2"/><rect x="900" y="690" width="550" height="34" rx="12" fill="#ea580c" stroke="#ea580c" stroke-width="0"/><text x="1175" y="713" class="boxh" text-anchor="middle">6. Trend-Aware Policy Control</text><text x="920" y="748" class="txt" text-anchor="start">• Detect sustained degrading trust trend</text><text x="920" y="770" class="txt" text-anchor="start">• Apply mild / strong penalty before final action mapping</text><text x="920" y="792" class="txt" text-anchor="start">• Separate estimation from decision control</text><text x="920" y="814" class="txt" text-anchor="start">• Purpose: recover responsiveness in evolving attacks</text><text x="920" y="836" class="txt" text-anchor="start"></text><text x="920" y="858" class="txt" text-anchor="start">T_final(x) = clamp(T_fused(x) − trend_penalty, 0, 1)</text><rect x="1500" y="690" width="580" height="210" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2"/><rect x="1500" y="690" width="580" height="34" rx="12" fill="#059669" stroke="#059669" stroke-width="0"/><text x="1790" y="713" class="boxh" text-anchor="middle">7. Policy Mapping &amp; Enforcement</text><text x="1520" y="748" class="txt" text-anchor="start">ALLOW       : 0.80 – 1.00</text><text x="1520" y="770" class="txt" text-anchor="start">LIMIT       : 0.50 – 0.79</text><text x="1520" y="792" class="txt" text-anchor="start">QUARANTINE  : 0.20 – 0.49</text><text x="1520" y="814" class="txt" text-anchor="start">BLOCK       : 0.00 – 0.19</text><text x="1520" y="836" class="txt" text-anchor="start"></text><text x="1520" y="858" class="txt" text-anchor="start">• PEP enforces final action</text><text x="1520" y="880" class="txt" text-anchor="start">• Support for allow / restrict / isolate / deny</text><line x1="850" y1="795" x2="900" y2="795" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><line x1="1450" y1="795" x2="1500" y2="795" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="90" y="940" width="650" height="160" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><rect x="90" y="940" width="650" height="34" rx="12" fill="#2563eb" stroke="#2563eb" stroke-width="0"/><text x="415" y="963" class="boxh" text-anchor="middle">8. Three-Way Evaluation Harness</text><text x="110" y="998" class="txt" text-anchor="start">Branch A: model-only      M(x) → policy</text><text x="110" y="1020" class="txt" text-anchor="start">Branch B: naive fusion    M(x)+R(x)+H(x) → policy</text><text x="110" y="1042" class="txt" text-anchor="start">Branch C: LTCA main path  adaptive fusion + trend-aware policy</text><text x="110" y="1064" class="txt" text-anchor="start"></text><text x="110" y="1086" class="txt" text-anchor="start">Purpose: compare base-paper path, uncontrolled augmentation, and controlled augmentation</text><rect x="790" y="940" width="620" height="160" rx="12" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/><rect x="790" y="940" width="620" height="34" rx="12" fill="#0ea5e9" stroke="#0ea5e9" stroke-width="0"/><text x="1100" y="963" class="boxh" text-anchor="middle">9. Logging, Explainability, and Metrics</text><text x="810" y="998" class="txt" text-anchor="start">• Log M(x), R(x), H(x), T_fused(x), T_final(x)</text><text x="810" y="1020" class="txt" text-anchor="start">• Decision trace, matched profile, trend state</text><text x="810" y="1042" class="txt" text-anchor="start">• Latency, artifact size, scenario metrics</text><text x="810" y="1064" class="txt" text-anchor="start">• JSON / CSV outputs for reproducible experiments</text><rect x="1460" y="940" width="620" height="160" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/><rect x="1460" y="940" width="620" height="34" rx="12" fill="#16a34a" stroke="#16a34a" stroke-width="0"/><text x="1770" y="963" class="boxh" text-anchor="middle">10. Frozen Benchmark &amp; Calibration Discipline</text><text x="1480" y="998" class="txt" text-anchor="start">• Separate calibration scenarios from training split</text><text x="1480" y="1020" class="txt" text-anchor="start">• Freeze fair benchmark scenarios for final evaluation</text><text x="1480" y="1042" class="txt" text-anchor="start">• Tune only policy/trend controls on calibration split</text><text x="1480" y="1064" class="txt" text-anchor="start">• Evaluate once on fixed fair benchmark</text><rect x="40" y="1170" width="2120" height="190" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="1100" y="1200" class="section" text-anchor="middle">Current Thesis Interpretation</text><text x="80" y="1245" class="txt" text-anchor="start">• Base paper / model-only path is a strong baseline: local WebAssembly edge IDS remains highly competitive for attack handling.</text><text x="80" y="1271" class="txt" text-anchor="start">• Adding retrieval context and behavioral memory naively can degrade decisions.</text><text x="80" y="1297" class="txt" text-anchor="start">• LTCA is currently strongest as a safer contextual integration strategy, especially for retrieval-noise mitigation.</text><text x="80" y="1323" class="txt" text-anchor="start">• Under fair, frozen benchmark scenarios, LTCA should be claimed as a bounded control-oriented augmentation method—not a universal replacement for model-only edge IDS.</text><text x="1100.0" y="1350" class="subtitle" text-anchor="middle">Runtime flow: Input → Features → M(x), R(x), H(x) → LTCA trust estimation → trend-aware policy → ALLOW / LIMIT / QUARANTINE / BLOCK</text></svg>